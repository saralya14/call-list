<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1714">
<title>Call List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1714'/%3E%3Cpath d='M22 16c2 0 3 1 4 3l3 7c1 2 0 3-1 4l-3 3c2 5 6 9 11 11l3-3c1-1 2-2 4-1l7 3c2 1 3 2 3 4v5c0 3-2 5-5 5C29 57 7 35 7 13c0-3 2-5 5-5z' transform='translate(2 2) scale(.9)' fill='%23e5322d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1c1714;--mute:#6e665f;--line:#e6e0d8;--red:#d42a24;--red2:#a51d18;--amber:#c97a06;--green:#1d8a4e;--band:#1c1714;--chip:#fff;--shadow:0 1px 2px rgba(28,23,20,.06),0 6px 18px rgba(28,23,20,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#141110;--card:#1f1b19;--ink:#f3eee8;--mute:#a59c93;--line:#332c28;--band:#0d0b0a;--chip:#26211e;--shadow:none}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
.band{background:var(--band);color:#f6f1ea;padding:18px 16px 16px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(229,50,45,.55),rgba(229,50,45,0) 70%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.brand{font-weight:800;font-size:13px;letter-spacing:.02em;color:#f0b4ae}
.ttl{font-size:26px;font-weight:800;line-height:1.1;margin:6px 0 2px;position:relative;z-index:1;text-wrap:balance}
.sub{color:#cfc5bb;font-size:13px;position:relative;z-index:1}
.gate{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.gbox{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.gbox b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.gbox span{font-size:12px;color:#cfc5bb}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden;position:relative;z-index:1}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#e5322d,#ff8a5c);border-radius:3px;transition:width .4s}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;min-height:38px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.search{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
main{padding:6px 12px 40px;max-width:720px;margin:0 auto}
.sec{margin:18px 4px 8px;display:flex;align-items:baseline;gap:8px}
.sec h2{font-size:15px;margin:0;font-weight:800}
.sec p{margin:0;color:var(--mute);font-size:12px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 14px 12px;margin-bottom:12px;position:relative}
.card.done{opacity:.62}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-size:17px;font-weight:800;line-height:1.2}
.meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.pill{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:#f7e3e1;color:var(--red2)}
.pill.sn{background:#e4ecf3;color:#2b5272}
@media(prefers-color-scheme:dark){.pill{background:#3a1f1d;color:#f3a29d}.pill.sn{background:#1d2a35;color:#a7c3db}}
.own{margin-top:8px;font-size:13.5px}
.own b{font-weight:700}
.own span{color:var(--mute);white-space:nowrap}
.ps{margin:12px 0 4px;display:grid;gap:9px}
.p{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;align-items:center}
.pl{font-size:12.5px;font-weight:600}
.pt{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.pt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pt::after{content:"";position:absolute;left:calc(105/110*100%);top:0;bottom:0;width:1px;background:var(--mute);opacity:.5}
.p.x .pt::after{display:none}
.pn{grid-column:2;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute)}
.pn b{color:var(--ink);font-weight:700;white-space:nowrap}
.pn em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.ok b{color:var(--green)}
.acts{display:grid;grid-template-columns:1fr 1.25fr 52px;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px;text-decoration:none;color:var(--ink);cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.call{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.tick[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.nomob{margin-top:10px;font-size:12.5px;color:var(--red)}
details.trk{margin-top:6px}
details.trk summary{cursor:pointer;color:var(--mute);font-size:13px;padding:10px 4px;list-style:none}
details.trk summary::before{content:"+ "}
details.trk[open] summary::before{content:"– "}
.trk li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.trk ul{list-style:none;margin:0 4px;padding:0}
.empty{max-width:420px;margin:60px auto;text-align:center;padding:0 24px}
.empty svg{width:120px;height:120px}
.empty h1{font-size:24px;margin:14px 0 6px}
.empty p{color:var(--mute);margin:0 0 20px}
.demo{background:#fff4d6;color:#5b4300;border:1px solid #f0d78c;border-radius:14px;padding:10px 12px;margin:12px 0 0;font-size:13px}
@media(prefers-color-scheme:dark){.demo{background:#2e2610;color:#f1d58a;border-color:#4d3f17}}
.demo input{width:100%;margin-top:6px;border:1px solid #e2c56f;border-radius:10px;padding:9px 10px;font-size:16px;background:#fff;color:#1c1714}
.demo .lnk{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:inherit;font-weight:600}
.warn{background:#fde6e4;color:var(--red2);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;font-weight:600}
.foot{color:var(--mute);font-size:12px;text-align:center;margin-top:24px;line-height:1.8}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:transform .25s,opacity .25s;z-index:20;max-width:92vw;opacity:0;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:#ff8a5c;font-weight:700;margin-left:10px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const BUILD = 'Call List v1.2 · 24-Nov-2026';
const PLAN_DEFAULT = 110, PUSH_FROM = 95;
const KEY = { data: 'cl_data_v1', done: 'cl_done_', terr: 'cl_terr', view: 'cl_view', demo: 'cl_demo', testMob: 'cl_testmob', parts: 'cl_parts_v2' };
/* Parameter slots in the QR, in message order: [achievement %, to go by the target date, daily need] */
const PARAMS = [
  { k: 'paid', label: 'Paid Service', icon: '🔧', one: 'Job Card', many: 'Job Cards', daily: true },
  { k: 'joy', label: 'JoyRide', icon: '🏍️', one: 'Enrolment', many: 'Enrolments', daily: true },
  { k: 'ret', label: 'Parts Retail', icon: '🛠️', rupee: true },
  { k: 'off', label: 'Parts Offtake', icon: '📦', rupee: true }
];
/* v1.2: shown after the four, % only in the message. RSA slot = [%, RSA to go]; SDD slot = % */
const EXTRA = [
  { k: 'rsa', label: 'RSA', short: 'RSA', near: 95 },
  { k: 'sdd', label: 'Same Day Delivery', short: 'SDD', near: 90, tip: 'Please ensure every jobcard is closed in the same day.' }
];
const GOAL_DEFAULT = { rsa: 105, sdd: 95 };
const BAR_N = 20;                                   // message bar: 20 blocks, full at the plan % (110)

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- sample list (shown only when "See a sample" is tapped) ---------- */
const SAMPLE = {
  v: 1, ts: '2026-11-19', ge: '2026-11-30', eb: 1, pc: 110, gl: { rsa: 105, sdd: 95 },
  sg: ['Saurabh', 'Area Manager - Service', 'AO Chandigarh, HMCL'],
  tr: ['Territory A', 'Territory B'],
  o: [
    ['10001', 'Sample Motors', 'Mohali', 'D', 0, 'Rakesh', '9800000001', [96.4, 45, 6], [88.1, 12, 2], [101.2, 38000], [93.4, 52000], [107, 0], 92],
    ['10002', 'Demo Autos', 'Kharar', 'D', 0, 'Harpreet', '9800000002', [104.2, 9, 2], [112, 0, 0], [99.0, 21500], [118, 0], [98, 6], 96],
    ['20003', 'Test Service Point', 'Ropar', 'S', 1, 'Gurdeep', '9800000003', [72.5, 61, 8], [64.0, 19, 3], [70.1, 46000], [58.8, 74000], [81, 9], 84],
    ['20004', 'Example Two Wheelers', 'Morinda', 'S', 1, '', '9800000004', [108.7, 3, 1], [97.5, 4, 1], [111.4, 0], [104.9, 9800], [110, 0], 95],
    ['10005', 'Model Moto Hub', 'Banur', 'D', 0, 'Vikas', '9800000005', [81.0, 38, 5], [90.0, 9, 2], [86.6, 33000], [79.9, 61000], [96, 4], 91],
    ['20006', 'Specimen Auto Care', 'Nangal', 'S', 1, 'Sukhwinder', '', [93.0, 14, 2], [85.0, 6, 1], [92.2, 12000], [88.0, 23000], [100, 2], 89],
    ['10007', 'Trial Hero Point', 'Zirakpur', 'D', 0, 'Manoj', '9800000007', [114.2, 0, 0], [118, 0, 0], [121.5, 0], [112.0, 0], [109, 0], 97],
    ['10008', 'Fine Tune Motors', 'Kurali', 'D', 0, 'Jaswant', '9800000008', [112.0, 0, 0], [110.5, 0, 0], [115.0, 0], [111.0, 0], [106, 0], 88]
  ]
};

/* ---------- reading the QR data ---------- */
function b64uBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/=]/g, '');
  while (s.length % 4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function gunzip(u) {
  if (typeof DecompressionStream === 'function') {
    const out = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(out).text();
  }
  await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  return window.pako.ungzip(u, { to: 'string' });
}
async function decode(raw) {
  const dot = raw.indexOf('.');
  const ver = dot > 0 ? raw.slice(0, dot) : '1', body = dot > 0 ? raw.slice(dot + 1) : raw;
  const bytes = b64uBytes(decodeURIComponent(body));
  const txt = ver === '0' ? new TextDecoder().decode(bytes) : await gunzip(bytes);
  const d = JSON.parse(txt);
  if (!d || !Array.isArray(d.o)) throw new Error('No outlet list in the QR');
  return d;
}
/* QR contract v2 (sheet v1.1+): compact rows, rupees in hundreds, per-day figure worked out here, big lists in parts.
   Sheet v1.2 adds r[10] = RSA [%, to go], r[11] = SDD % and gl = goals; a v1.1 QR simply has none of them. */
function expand(d) {
  if (d.v !== 2) return d;
  const wd = d.wd || {};
  const P = (x, w) => Array.isArray(x) ? [x[0], x[1], w > 0 ? Math.ceil(x[1] / w) : 0] : null;
  const R = x => Array.isArray(x) ? [x[0], x[1] * 100] : null;
  return { v: 1, ts: d.ts, ge: d.ge, eb: d.eb, pc: d.pc, sg: d.sg, tr: d.tr, gl: d.gl,
    o: d.o.map(r => [r[0], r[1], '', r[2] ? 'S' : 'D', r[3], r[4], r[5], P(r[6], wd.paid), P(r[7], wd.joy), R(r[8]), R(r[9]),
      Array.isArray(r[10]) ? r[10] : null, r[11] == null ? null : r[11]]) };
}
/* one part of a list that came in several QRs; returns the whole list once every part is in */
function addPart(d) {
  let st = null;
  try { st = JSON.parse(store.get(KEY.parts) || 'null'); } catch (e) {}
  if (!st || st.id !== d.id || st.n !== d.n) st = { id: d.id, n: d.n, got: {} };
  st.got[d.k] = d;
  if (!store.set(KEY.parts, JSON.stringify(st))) return { err: true };
  const have = Object.keys(st.got).map(Number).sort((a, b) => a - b);
  if (have.length < d.n) return { have, n: d.n };
  store.del(KEY.parts);
  const all = Object.assign({}, st.got[1], { o: [] });
  for (let k = 1; k <= d.n; k++) all.o = all.o.concat(st.got[k].o);
  delete all.k; all.n = 1;
  return { all };
}
function waitView(w) {
  const dots = Array.from({ length: w.n }, (_, i) => '<span style="display:inline-block;width:34px;height:34px;line-height:34px;border-radius:17px;margin:0 4px;font-weight:800;' +
    (w.have.indexOf(i + 1) >= 0 ? 'background:var(--green);color:#fff">&#10003;' : 'background:var(--line);color:var(--mute)">' + (i + 1)) + '</span>').join('');
  const next = Array.from({ length: w.n }, (_, i) => i + 1).filter(k => w.have.indexOf(k) < 0);
  return '<div class="empty"><div style="margin-bottom:16px">' + dots + '</div><h1>QR ' + w.have.join(', ') + ' of ' + w.n + ' read</h1>' +
    '<p>Now scan QR ' + next.join(' and ') + ' on the laptop. The call list opens when ' + (w.n === 2 ? 'both are' : 'all ' + w.n + ' are') + ' in.</p>' +
    '<button class="btn call" id="restart" style="width:100%;max-width:280px;margin:0 auto">Start over</button><div class="foot">' + BUILD + '</div></div>';
}
function hashData() {
  const h = location.hash.slice(1);
  if (!h) return null;
  const m = h.match(/(?:^|&)d=([^&]+)/);
  return m ? m[1] : null;
}

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function pd(s) { const p = String(s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
function ordDay(s) {
  const d = pd(s); if (!d) return '';
  const n = d.getDate(), v = n % 100, suf = (v >= 11 && v <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
  return n + suf + ' ' + d.toLocaleString('en-GB', { month: 'short' });
}
function daysTo(s) { const d = pd(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 864e5); }
function mobile(m) {
  let x = String(m || '').replace(/\D/g, '');
  if (x.length === 11 && x[0] === '0') x = x.slice(1);
  if (x.length === 12 && x.slice(0, 2) === '91') x = x.slice(2);
  return x.length === 10 ? x : '';
}
function ownerJi(n) { return /\bji$/i.test(n) ? n : n + ' Ji'; }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good Morning!' : h < 17 ? 'Good Afternoon!' : 'Good Evening!'; }

/* ---------- one outlet ---------- */
function outlet(r, plan, gl) {
  const o = { code: String(r[0]), name: r[1] || '', town: r[2] || '', type: r[3] === 'S' ? 'S' : 'D', t: +r[4] || 0, owner: (r[5] || '').trim(), mob: mobile(r[6]), ps: [], xs: [] };
  PARAMS.forEach((p, i) => {
    const v = r[7 + i];
    if (!Array.isArray(v) || v[0] == null || v[0] === '') return;
    const x = { p, pct: +v[0], go: Math.max(0, Math.ceil(+v[1] || 0)), day: Math.max(0, Math.ceil(+v[2] || 0)) };
    x.open = x.pct < plan && x.go > 0;
    o.ps.push(x);
  });
  EXTRA.forEach((p, i) => {
    let v = r[11 + i];
    if (v == null || v === '') return;
    if (!Array.isArray(v)) v = [v];
    if (v[0] == null || v[0] === '' || !isFinite(+v[0])) return;
    const x = { p, pct: +v[0], goal: +((gl || {})[p.k]) || GOAL_DEFAULT[p.k], hasGo: v.length > 1, go: Math.max(0, Math.ceil(+v[1] || 0)) };
    x.open = x.pct < x.goal && !(x.hasGo && x.go === 0);
    o.xs.push(x);
  });
  o.short = o.ps.filter(x => x.open);
  o.xopen = o.xs.filter(x => x.open);
  o.near = o.short.filter(x => x.pct >= PUSH_FROM).length;
  o.gap = o.short.reduce((a, x) => a + (plan - x.pct), 0);
  // call order stays on the four; an outlet with only RSA / SDD open still gets a message (end of "Push")
  o.group = !o.short.length && !o.xopen.length ? 'ok' : (o.near || !o.short.length) ? 'push' : 'gap';
  return o;
}

/* ---------- the WhatsApp message (Saurabh's layout, 24-Nov-2026) ---------- */
const BOLD = s => '*' + s + '*', ITAL = s => '_' + s + '_';
const pctTxt = p => String(Math.floor(+p + 1e-9));
function bar(pct, plan) { const n = Math.max(0, Math.min(BAR_N, Math.floor(pct / plan * BAR_N + 1e-9))); return '▓'.repeat(n) + '░'.repeat(BAR_N - n); }
function message(o, D) {
  const plan = D.pc || PLAN_DEFAULT, by = ordDay(D.ge);
  const hi = o.owner ? ownerJi(o.owner) : o.name + ' Team';
  const L = ['Hi ' + hi + ', ' + greeting() + ' 🙏', ''];
  L.push('📊 Performance Status | Till ' + ordDay(D.ts));
  L.push('🎯 Final Goal by ' + by + ': ' + BOLD(plan + '%'));
  if (o.xs.length) L.push('(' + o.xs.map(x => x.p.short + ' - ' + BOLD(x.goal + '%')).join(' | ') + ')');
  L.push('', "Here's where we stand:", '');
  const open = o.ps.filter(x => x.open);
  const weak = open.reduce((a, x) => (!a || x.pct < a.pct ? x : a), null);
  const focus = weak && weak.pct < PUSH_FROM ? weak : null;
  o.ps.forEach(x => {
    if (!x.open) { L.push('✅ ' + x.p.label + ' - ' + BOLD(pctTxt(x.pct) + '%') + ' | Achieved', ''); return; }
    L.push(x.p.icon + ' ' + x.p.label + ' - ' + BOLD(pctTxt(x.pct) + '%'), bar(x.pct, plan));
    let need = 'Need: ' + (x.p.rupee ? BOLD(inr(x.go)) + ' more' : BOLD(x.go) + ' more ' + (x.go === 1 ? x.p.one : x.p.many));
    if (x.p.daily && x.day > 0) need += ' | ' + BOLD('~' + x.day) + ' per day';
    if (x === focus) need += ' | ' + ITAL('Needs maximum focus');
    L.push(need, '');
  });
  o.xs.forEach(x => {
    L.push((x.open ? '🟡 ' : '✅ ') + x.p.label + ' - ' + BOLD(pctTxt(x.pct) + '%') + (x.open ? '' : ' | Achieved'));
    if (x.open && x.p.tip) L.push(ITAL(x.p.tip));
  });
  if (o.xs.length) L.push('');
  if (D.eb && o.type === 'D') L.push('⭐ Special Note:', ITAL('Achieving ' + plan + '% by ' + by + ' will also unlock the Early Bird Bonus!'), '');
  const sg = Array.isArray(D.sg) && D.sg.length ? D.sg.filter(Boolean) : ['Saurabh'];
  L.push('Regards,'); sg.forEach((s, i) => L.push(i === 0 ? BOLD(s) : s));
  return L.join('\n');
}

/* ---------- state ---------- */
let D = null, OUT = [], isDemo = false;
const today = ymd(new Date());
let done = new Set(JSON.parse(store.get(KEY.done + today) || '[]'));
let terr = store.get(KEY.terr) || 'all', view = store.get(KEY.view) || 'todo', q = '';
let testMob = store.get(KEY.testMob) || '';

function saveDone() { store.set(KEY.done + today, JSON.stringify([...done])); }
function setData(d, demo) {
  D = d; isDemo = !!demo;
  const plan = D.pc || PLAN_DEFAULT;
  OUT = D.o.map(r => outlet(r, plan, D.gl));
  if (terr !== 'all' && !(D.tr || [])[+terr]) terr = 'all';
}

/* ---------- drawing ---------- */
const ICON = {
  call: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3 .78.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.25-.12-1.46-.72-1.69-.8s-.39-.12-.55.12-.63.8-.78.97-.29.18-.53.06a6.7 6.7 0 0 1-3.3-2.9c-.25-.43.25-.4.71-1.33a.45.45 0 0 0-.02-.42c-.06-.12-.55-1.33-.76-1.82s-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.3 2.7 2.7 0 0 0-.85 2 4.7 4.7 0 0 0 1 2.5 10.8 10.8 0 0 0 4.1 3.65c1.53.66 2.13.72 2.9.6a2.5 2.5 0 0 0 1.62-1.15 2 2 0 0 0 .14-1.15c-.06-.1-.22-.16-.46-.28z"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
function barColor(p, plan) { return p >= plan ? 'var(--green)' : p >= 105 ? '#2f9e6a' : p >= PUSH_FROM ? 'var(--amber)' : 'var(--red)'; }

function card(o) {
  const plan = D.pc || PLAN_DEFAULT, isDone = done.has(o.code);
  const mob = isDemo ? mobile(testMob) || o.mob : o.mob;
  const rows = o.ps.map(x => {
    const w = Math.max(3, Math.min(100, x.pct / plan * 100));
    const ok = x.pct >= plan || x.go <= 0;
    const need = ok ? '<b>Achieved</b>' : x.p.rupee ? '<b>' + inr(x.go) + '</b> to go' : '<b>' + x.go + ' ' + (x.go === 1 ? x.p.one : x.p.many).toLowerCase() + '</b>' + (x.p.daily && x.day ? ' · ' + x.day + '/day' : '');
    return '<div class="p' + (ok ? ' ok' : '') + '"><div class="pl">' + x.p.label + '</div><div class="pt"><i style="width:' + w.toFixed(1) + '%;background:' + barColor(x.pct, plan) + '"></i></div>' +
      '<div class="pn"><span>' + need + '</span><em>' + (x.pct % 1 ? x.pct.toFixed(1) : x.pct) + '%</em></div></div>';
  }).join('') + o.xs.map(x => {
    const w = Math.max(3, Math.min(100, x.pct / x.goal * 100));
    const need = !x.open ? '<b>Achieved</b>' : x.hasGo && x.go ? '<b>' + x.go + ' RSA</b> to go' : 'Goal <b>' + x.goal + '%</b>';
    const col = !x.open ? 'var(--green)' : x.pct >= x.p.near ? 'var(--amber)' : 'var(--red)';
    return '<div class="p x' + (x.open ? '' : ' ok') + '"><div class="pl">' + x.p.short + '</div><div class="pt"><i style="width:' + w.toFixed(1) + '%;background:' + col + '"></i></div>' +
      '<div class="pn"><span>' + need + '</span><em>' + (x.pct % 1 ? x.pct.toFixed(1) : x.pct) + '%</em></div></div>';
  }).join('');
  const wa =mob ? 'https://api.whatsapp.com/send?phone=91' + mob + '&text=' + encodeURIComponent(message(o, D)) : '';
  const tname = (D.tr || [])[o.t] || '';
  return '<article class="card' + (isDone ? ' done' : '') + '" data-c="' + esc(o.code) + '">' +
    '<div class="ch"><div><div class="nm">' + esc(o.name) + '</div><div class="meta">' + esc(o.code) + (o.town ? ' · ' + esc(o.town) : '') + (tname && (D.tr || []).length > 1 ? ' · ' + esc(tname) : '') + '</div></div>' +
    '<span class="pill' + (o.type === 'S' ? ' sn' : '') + '">' + (o.type === 'S' ? 'SN' : 'Dealer') + '</span></div>' +
    '<div class="own">' + (o.owner ? '<b>' + esc(ownerJi(o.owner)) + '</b> ' : '<b>Owner name not in sheet</b> ') + (mob ? '<span>· ' + mob.slice(0, 5) + ' ' + mob.slice(5) + '</span>' : '') + '</div>' +
    '<div class="ps">' + rows + '</div>' +
    (mob ? '' : '<div class="nomob">No mobile number in the sheet for this outlet.</div>') +
    '<div class="acts">' +
      '<a class="btn call" href="' + (mob ? 'tel:+91' + mob : '#') + '"' + (mob ? '' : ' aria-disabled="true"') + '>' + ICON.call + 'Call</a>' +
      '<a class="btn wa" data-wa="1" href="' + (wa ? esc(wa) : '#') + '" target="_blank" rel="noopener"' + (wa ? '' : ' aria-disabled="true"') + '>' + ICON.wa + 'WhatsApp</a>' +
      '<button class="btn tick" data-tick="1" aria-pressed="' + isDone + '" aria-label="Mark as done">' + ICON.tick + '</button>' +
    '</div></article>';
}

function draw() {
  const app = document.getElementById('app');
  if (!D) { app.innerHTML = emptyView(); bind(); return; }
  const plan = D.pc || PLAN_DEFAULT, trs = D.tr || [];
  const inTerr = OUT.filter(o => terr === 'all' || String(o.t) === terr);
  const live = inTerr.filter(o => o.group !== 'ok');
  const nDone = live.filter(o => done.has(o.code)).length;
  const s = q.trim().toLowerCase();
  const show = live.filter(o => (view === 'all' || (view === 'done') === done.has(o.code)) &&
    (!s || (o.name + ' ' + o.code + ' ' + o.owner + ' ' + o.town).toLowerCase().includes(s)));
  const push = show.filter(o => o.group === 'push').sort((a, b) => b.near - a.near || a.gap - b.gap);
  const gap = show.filter(o => o.group === 'gap').sort((a, b) => b.gap - a.gap);
  const ok = inTerr.filter(o => o.group === 'ok');
  const dl = daysTo(D.ge), stale = dl != null && dl < 0;
  const head = trs.length === 1 ? trs[0] : terr !== 'all' ? trs[+terr] : trs.length ? trs.length + ' territories' : 'Call list';

  let h = '<header class="band"><div class="top"><span class="brand">CALL LIST</span><span class="brand" style="color:#cfc5bb;font-weight:600">Numbers till ' + ordDay(D.ts) + '</span></div>' +
    '<div class="ttl">' + esc(head) + '</div><div class="sub">Target ' + plan + '% by ' + ordDay(D.ge) + (D.eb ? ' · Early Bird date' : '') + '</div>' +
    '<div class="gate"><div class="gbox"><b>' + (live.length - nDone) + '</b><span>left to call</span></div><div class="gbox"><b>' + nDone + '</b><span>done today</span></div><div class="gbox"><b>' + (stale ? '0' : dl) + '</b><span>' + (dl === 1 ? 'day left' : 'days left') + '</span></div></div>' +
    '<div class="prog"><i style="width:' + (live.length ? nDone / live.length * 100 : 0) + '%"></i></div>' +
    (stale ? '<div class="warn">This list was for ' + ordDay(D.ge) + '. Scan a fresh QR from the sheet.</div>' : '') +
    (isDemo ? '<div class="demo"><b>Sample list.</b> Type your own mobile to send the sample messages to yourself:<input id="testmob" inputmode="numeric" maxlength="14" placeholder="10-digit mobile" value="' + esc(testMob) + '"><div style="margin-top:6px"><button class="lnk" id="exitdemo">Close the sample</button></div></div>' : '') +
    '</header>';

  h += '<div class="bar">';
  if (trs.length > 1) {
    h += '<div class="row" role="group" aria-label="Territory">' + chip('terr', 'all', 'All', inTerrCount('all')) +
      trs.map((t, i) => chip('terr', String(i), t, inTerrCount(String(i)))).join('') + '</div><div style="height:8px"></div>';
  }
  h += '<div class="row" role="group" aria-label="Show">' + chip('view', 'todo', 'To call', live.length - nDone) + chip('view', 'done', 'Done', nDone) + chip('view', 'all', 'All', live.length) + '</div>';
  h += '<input class="search" id="q" type="search" placeholder="Find outlet, owner or code" value="' + esc(q) + '"></div>';

  h += '<main>';
  if (push.length) h += sec('Push to ' + plan + '%', 'A parameter between ' + PUSH_FROM + '% and ' + plan + '%, or only RSA / SDD left. Call first.') + push.map(card).join('');
  if (gap.length) h += sec('Big gap', 'All open parameters below ' + PUSH_FROM + '%. Biggest gap first.') + gap.map(card).join('');
  if (!push.length && !gap.length) h += '<div class="empty" style="margin:40px auto"><p>' + (view === 'todo' && live.length ? 'Everyone here is done for today.' : 'Nothing to show.') + '</p></div>';
  if (ok.length) h += '<details class="trk"><summary>At goal on every parameter · ' + ok.length + ' (no call needed)</summary><ul>' +
    ok.map(o => '<li><span>' + esc(o.name) + '</span><span style="color:var(--mute)">' + esc(o.code) + '</span></li>').join('') + '</ul></details>';
  h += '<div class="foot">To refresh, scan a new QR from the Master sheet.<br><button id="clear">Clear this list from the phone</button><br>' + BUILD + '</div></main>';
  app.innerHTML = h;
  bind();
}
function inTerrCount(t) { return OUT.filter(o => o.group !== 'ok' && (t === 'all' || String(o.t) === t)).length; }
function chip(kind, val, label, n) {
  const on = kind === 'terr' ? terr === val : view === val;
  return '<button class="chip" data-' + kind + '="' + esc(val) + '" aria-pressed="' + on + '">' + esc(label) + '<small>' + n + '</small></button>';
}
function sec(t, p) { return '<div class="sec"><h2>' + t + '</h2></div><p style="margin:-4px 4px 10px;color:var(--mute);font-size:12px">' + p + '</p>'; }
function emptyView() {
  return '<div class="empty"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="14" width="92" height="92" rx="22" fill="#1c1714"/>' +
    '<g fill="#fff"><rect x="28" y="28" width="22" height="22" rx="4"/><rect x="70" y="28" width="22" height="22" rx="4"/><rect x="28" y="70" width="22" height="22" rx="4"/></g>' +
    '<g fill="#1c1714"><rect x="34" y="34" width="10" height="10" rx="2"/><rect x="76" y="34" width="10" height="10" rx="2"/><rect x="34" y="76" width="10" height="10" rx="2"/></g>' +
    '<g fill="#e5322d"><rect x="70" y="70" width="8" height="8" rx="2"/><rect x="84" y="70" width="8" height="8" rx="2"/><rect x="70" y="84" width="8" height="8" rx="2"/><rect x="84" y="84" width="8" height="8" rx="2"/><rect x="57" y="57" width="6" height="6" rx="1.5"/></g></svg>' +
    '<h1>Scan the call-list QR</h1><p>Open the Master sheet on your laptop, make the QR for a territory and scan it with this phone\'s camera.</p>' +
    '<button class="btn call" id="sample" style="width:100%;max-width:280px;margin:0 auto">See a sample</button>' +
    '<div class="foot">' + BUILD + '</div></div>';
}

/* ---------- events ---------- */
let toastT = 0;
function toast(html) { const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000); }
function mark(code, on) {
  if (on) done.add(code); else done.delete(code);
  saveDone(); draw();
}
function bind() {
  const g = id => document.getElementById(id);
  g('sample') && (g('sample').onclick = () => { store.set(KEY.demo, '1'); setData(SAMPLE, true); draw(); scrollTo(0, 0); });
  g('exitdemo') && (g('exitdemo').onclick = () => { store.del(KEY.demo); D = null; OUT = []; boot(); });
  g('testmob') && (g('testmob').onchange = e => { testMob = e.target.value; store.set(KEY.testMob, testMob); draw(); });
  g('clear') && (g('clear').onclick = () => { store.del(KEY.data); store.del(KEY.demo); D = null; OUT = []; draw(); });
  const qi = g('q');
  if (qi) qi.oninput = e => { q = e.target.value; const pos = e.target.selectionStart; draw(); const n = g('q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} };
  document.querySelectorAll('[data-terr]').forEach(b => b.onclick = () => { terr = b.dataset.terr; store.set(KEY.terr, terr); draw(); });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; store.set(KEY.view, view); draw(); });
  document.querySelectorAll('.card').forEach(c => {
    const code = c.dataset.c;
    c.querySelector('[data-tick]').onclick = () => mark(code, !done.has(code));
    const w = c.querySelector('[data-wa]');
    if (w.getAttribute('aria-disabled') !== 'true') w.addEventListener('click', () => {
      setTimeout(() => {
        if (done.has(code)) return;
        mark(code, true);
        toast('Marked done<button id="undo">Undo</button>');
        const u = document.getElementById('undo'); if (u) u.onclick = () => { mark(code, false); document.getElementById('toast').classList.remove('on'); };
      }, 400);
    });
  });
}

/* ---------- start ---------- */
async function boot() {
  const raw = hashData();
  if (raw) {
    try {
      let d = await decode(raw);
      if (d.v === 2 && d.n > 1) {
        const w = addPart(d);
        if (w.err) throw new Error('This browser cannot keep the first QR. Open the page in Chrome and scan again.');
        if (!w.all) {
          history.replaceState(null, '', location.pathname + location.search);
          document.getElementById('app').innerHTML = waitView(w);
          document.getElementById('restart').onclick = () => { store.del(KEY.parts); D = null; OUT = []; boot(); };
          return;
        }
        d = w.all;
      }
      d = expand(d);
      store.del(KEY.demo);
      const kept = store.set(KEY.data, JSON.stringify(d));
      if (kept) history.replaceState(null, '', location.pathname + location.search);
      terr = 'all'; view = 'todo'; store.set(KEY.terr, terr); store.set(KEY.view, view);
      setData(d, false); draw();
      toast(d.o.length + ' outlets loaded');
      return;
    } catch (e) {
      document.getElementById('app').innerHTML = '<div class="empty"><h1>QR could not be read</h1><p>' + esc(e.message || e) + '</p><p>Make the QR again in the sheet and scan once more.</p></div>';
      return;
    }
  }
  if (store.get(KEY.demo) === '1') { setData(SAMPLE, true); draw(); return; }
  const kept = store.get(KEY.data);
  if (kept) { try { setData(JSON.parse(kept), false); } catch (e) { D = null; } }
  draw();
}
window.addEventListener('hashchange', boot);
window.__cl = { decode, expand, message, outlet, bar, SAMPLE };
boot();
}
</script>
